version = 0.1

# `build_in_source` is the important setting here.
#
# By default SAM copies CodeUri into a scratch directory and runs `npm install` in it. That breaks
# for an npm workspace: `@kagazready/contracts` and `@kagazready/rules` are symlinks in the
# repository's root node_modules, so npm looks for them on the public registry and fails with a 404.
# Building in source leaves the code where it is, so ordinary Node resolution walks up to the root
# node_modules and esbuild bundles the workspace packages from their TypeScript sources.
#
# Telemetry is disabled: this is a document-privacy project, and build metadata does not need to
# leave the machine.

[default.global.parameters]
stack_name = "kagazready"
region = "ap-south-1"

[default.build.parameters]
build_in_source = true
cached = true

[default.validate.parameters]
lint = true

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM"
confirm_changeset = false
resolve_s3 = true
# BedrockModelId is deliberately empty for the first deploy.
#
# The intended model is apac.amazon.nova-lite-v1:0 (an APAC cross-region inference profile — Nova
# is not on-demand in ap-south-1 directly). It is the cheapest model whose agreement this account
# can accept; Anthropic models report agreementAvailability NOT_AVAILABLE for a new account. Until
# the agreement is accepted in the Bedrock console, an empty model ID is a supported configuration:
# no Bedrock call is made, the deterministic analysis is unaffected, and explanations use reviewed
# English fallback copy with explanationsDegraded reported as true.
#
# AllowedOrigin starts as the local dev server because Amplify Hosting does not exist yet. It must
# be updated to the deployed frontend origin before the public demo; the API URL does not change.
parameter_overrides = "Stage=prod BedrockModelId= BedrockRegion= DailyAnalysisCap=150 AllowedOrigin=http://localhost:5173"
